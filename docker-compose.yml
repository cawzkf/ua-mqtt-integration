version: '3.8'

services:
  # Aplicação principal MQTT-OPC UA Bridge
  ua-mqtt-bridge:
    build: .
    container_name: ua-mqtt-bridge
    ports:
      - "4840:4840"    # OPC UA Server
      - "8080:8080"    # Dashboard/API (opcional)
    environment:
      - OPCUA_ENDPOINT=opc.tcp://0.0.0.0:4840/freeopcua/server/
      - MQTT_BROKER_HOST=mqtt-broker
      - MONGODB_HOST=mongodb
      - MONGODB_DATABASE=motor50cv_history
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      - mqtt-broker
      - mongodb
    restart: unless-stopped
    networks:
      - iot-network

  # MQTT Broker (Mosquitto)
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"    # MQTT
      - "9001:9001"    # WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - iot-network

  # MongoDB para histórico
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=motor50cv_history
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - iot-network

  # MongoDB Express (Interface Web)
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password123
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - iot-network

  # Simulador MQTT (para testes)
  mqtt-simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: mqtt-simulator
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
    depends_on:
      - mqtt-broker
    restart: unless-stopped
    networks:
      - iot-network
    profiles:
      - testing

volumes:
  mongodb_data:
  mosquitto_data:
  mosquitto_log:

networks:
  iot-network:
    driver: bridge
